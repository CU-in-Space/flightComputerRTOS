# OpenOCD configuration for the NUCLEO-H753ZI (on-board ST-LINK).
#
# Used for both flashing (`cmake --build --preset debug --target flash`) and
# debugging (VS Code F5). Verified with OpenOCD 0.11 (Ubuntu 22.04) and 0.12
# (Homebrew) on ST-LINK V3 firmware V3J5 and V3J16.
#
# If flashing fails with "mode (transport) not supported by device", "init mode
# failed" or LIBUSB_ERROR_OTHER, swap the USB cable before touching anything
# here: a marginal cable produced all of those during bring-up.

source [find interface/stlink.cfg]
transport select hla_swd

# 2 MB in two banks; the single-bank stm32h7x.cfg only exposes the first 1 MB.
source [find target/stm32h7x_dual_bank.cfg]

reset_config srst_only

# The default 3.3 MHz is unreliable on H7 when the target clock is unknown at
# connect time.
adapter speed 1800
