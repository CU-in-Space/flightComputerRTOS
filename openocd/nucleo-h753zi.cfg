# OpenOCD configuration for the NUCLEO-H753ZI (on-board ST-LINK).
#
# NOTE: prefer `cmake --build --preset debug --target flash`, which uses
# STM32CubeProgrammer. OpenOCD 0.12.0 has a known bug flashing STM32H7 through
# an ST-LINK *V3*: it does not drive the reset line low unless the target was
# manually reset first, and the write dies with
#   Error: jtag status contains invalid mode value - communication failure
# See https://github.com/zephyrproject-rtos/zephyr/issues/51508
# Debugging (attach) works fine -- it is only flashing that is affected.

source [find interface/stlink.cfg]
transport select hla_swd

# 2 MB in two banks; the single-bank stm32h7x.cfg only exposes the first 1 MB.
source [find target/stm32h7x_dual_bank.cfg]

reset_config srst_only

# The default 3.3 MHz is unreliable on H7 when the target clock is unknown at
# connect time.
adapter speed 1800
